<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#120c08">
  <title>Starturn 試遊版</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120c08;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #120c08; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      color: #e8d4aa; font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; background: #120c08; }
    #loading h1 { margin: 0; font-size: clamp(28px, 6vmin, 56px); font-weight: 600; letter-spacing: 0.12em; }
    #loading p { margin: 0; font-size: clamp(14px, 3vmin, 22px); opacity: 0.85; }
    #bar { width: min(60vw, 420px); height: 6px; background: #3a2a1c; border-radius: 3px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #e0a84a; transition: width 0.2s; }
    #rotate { display: none; font-size: clamp(20px, 6vw, 36px); }
    @media (orientation: portrait) { #rotate { display: block; } }
    #error { display: none; max-width: 80vw; color: #ffb4a0; font-family: sans-serif; font-size: 15px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>Starturn</h1>
    <p>星まわり　試遊版</p>
    <div id="bar"><div id="fill"></div></div>
    <p id="status">読み込み中…</p>
    <p id="rotate">横にしてください</p>
    <div id="error"></div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var statusLine = document.querySelector("#status");
    var errorBox = document.querySelector("#error");

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = "起動できませんでした：" + msg;
      statusLine.textContent = "";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "RouletteRoguelike",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === "error") showError(msg); else console.warn(msg); },
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        showError(message);
      });
    };
    script.onerror = function () { showError("読み込みのファイルが見つからない"); };
    document.body.appendChild(script);
  </script>
</body>
</html>
